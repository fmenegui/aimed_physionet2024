name: CPU software checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Create the documented virtual environment
        shell: bash
        run: |
          python -m venv .venv
          python - <<'PY'
          import os
          from pathlib import Path
          binary = Path('.venv') / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a') as file:
              file.write(str(binary.resolve()) + '\n')
          PY
      - name: Verify virtual environment activation
        run: python -c "import sys; assert sys.prefix != sys.base_prefix"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e media
      - run: python -m pip check
      - run: python -m pytest -q
