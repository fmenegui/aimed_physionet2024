name: Tutorial integration
on:
  push:
    paths:
      - '**/*.py'
      - '*requirements*.txt'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public clone command
        run: git clone --depth 1 https://github.com/fmenegui/aimed_physionet2024.git /tmp/aimed-public-clone
      - name: Download and verify published ensemble
        run: python download_weights.py --kind ensemble
      - name: Build documented CUDA runtime image
        run: docker build -t aimed-physionet2024 .
      - name: Check container dependencies
        run: docker run --rm aimed-physionet2024 python -m pip check
      - name: Create artificial input
        run: |
          mkdir -p data outputs
          docker run --rm -v "$PWD/data:/challenge/data" aimed-physionet2024 python examples/make_demo_data.py --output data/demo --records 20
          cp data/demo/demo000-0.png data/ecg.png
      - name: Run documented image inference command
        run: docker run --rm -v "$PWD/model:/challenge/model" -v "$PWD/data:/challenge/data:ro" -v "$PWD/outputs:/challenge/outputs" aimed-physionet2024 python predict_image.py -i data/ecg.png -m model -o outputs/prediction.json
      - name: Run Challenge folder inference
        run: docker run --rm -v "$PWD/model:/challenge/model" -v "$PWD/data:/challenge/data:ro" -v "$PWD/outputs:/challenge/outputs" aimed-physionet2024 python run_model.py -d data/demo -m model -o outputs/challenge -v
      - name: Train and save a container checkpoint
        run: docker run --rm -v "$PWD/data:/challenge/data:ro" -v "$PWD/outputs:/challenge/outputs" aimed-physionet2024 python train.py -d data/demo -m outputs/training --init none --fold 0 --epochs 1 --size 64 --batch-size 2 --num-workers 0 --device cpu --fast-dev-run --quiet
      - name: Validate inference output
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = json.loads(Path('outputs/prediction.json').read_text())
          assert len(p['probabilities']) == 11
          assert len(p['checkpoints']) == 5
          assert all(math.isfinite(v) and 0 <= v <= 1 for v in p['probabilities'].values())
          assert len(list(Path('outputs/challenge').glob('*.hea'))) == 20
          assert Path('outputs/training/model/model_fold0.ckpt').is_file()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-tutorial-evidence
          path: |
            outputs/prediction.json
            outputs/challenge/*.hea
            outputs/training/run_config.json
            outputs/training/metrics.json
            outputs/training/output.log
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-generator.txt
      - name: Install generator environment
        run: |
          python -m venv .venv-generator
          .venv-generator/bin/python -m pip install -r requirements-generator.txt
          .venv-generator/bin/python -m pip check
      - name: Check out pinned upstream generator
        run: |
          git clone --filter=blob:none --sparse https://github.com/alphanumericslab/ecg-image-kit.git third_party/ecg-image-kit
          git -C third_party/ecg-image-kit sparse-checkout set codes/ecg-image-generator
          git -C third_party/ecg-image-kit checkout 27b90f56896c9fc78b05a83ca14844ea2637aa0b
      - name: Fetch bounded public PTB-XL fixture
        run: python scripts/fetch_tutorial_fixture.py --output data/tutorial
      - name: Prepare genuine PTB-XL and PTB-XL+ labels
        run: |
          .venv-generator/bin/python prepare_ptbxl_data.py -i data/tutorial/ptb-xl/records500/00000 -pd data/tutorial/ptb-xl/ptbxl_database.csv -pm data/tutorial/ptb-xl/scp_statements.csv -sd data/tutorial/ptb-xl-plus/labels/12sl_statements.csv -sm data/tutorial/ptb-xl-plus/labels/mapping/12slv23ToSNOMED.csv -o data/tutorial/prepared/00000
      - name: Execute documented ECG-Image-Kit command
        run: |
          .venv-generator/bin/python third_party/ecg-image-kit/codes/ecg-image-generator/gen_ecg_images_from_data_batch.py -i "$PWD/data/tutorial/prepared/00000" -o "$PWD/data/tutorial/images/00000" --print_header
      - name: Register generated images
        run: .venv-generator/bin/python prepare_image_data.py -i data/tutorial/images/00000 -o data/tutorial/registered/00000
      - name: Validate generated records
        run: |
          .venv-generator/bin/python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          fixture = json.loads(Path('data/tutorial/fixture_manifest.json').read_text())
          assert fixture['patient_disjoint']
          root = Path('data/tutorial/registered/00000')
          headers = list(root.glob('*.hea'))
          assert len(headers) == 20
          for header in headers:
              text = header.read_text()
              assert '# Labels:' in text and '# Image:' in text
              images = next(line for line in text.splitlines() if line.startswith('# Image:')).split(':',1)[1]
              for name in images.split(','):
                  with Image.open(root/name.strip()) as image:
                      image.verify()
          print('20 genuine PTB-XL records prepared, rendered and registered')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptbxl-generator-tutorial-evidence
          path: |
            data/tutorial/fixture_manifest.json
            data/tutorial/registered/00000/*.hea
